name: Daily Auto Commit

on:
  schedule:
    # Runs at 00:00 UTC (8:00 AM Manila Time) every day
    - cron: '0 0 * * *'
  workflow_dispatch: # Allows manual trigger anytime

jobs:
  commit-job:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Update Timestamp
        run: |
          echo "Automated ping at $(date -u)" >> log.txt

      - name: Commit and Push
        run: |
          git config user.name "ZaireTheGreatt"
          git config user.email "151698056+ZaireTheGreatt@users.noreply.github.com"
          git add log.txt
          git commit -m "chore: automated daily update" || exit 0
          git push
